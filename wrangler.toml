name = "secure-authenticator"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[env.production]
name = "secure-authenticator-prod"
route = "https://auth.example.com/*"
zone_id = ""

[[kv_namespaces]]
binding = "AUTH_STORE"
id = ""
preview_id = ""

[build]
command = "npm run build"
cwd = "."
main = "dist/index.js"
